# CI on the GitHub mirror: the same checks the GitLab pipeline runs (format,
# lints, tests, viewer parity, MSRV), plus a lint of the workflows themselves.
# `ci-ok` is the single job to require in branch protection.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# One run per ref; a superseded pull-request run is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      # Caching is fine here, unlike in release.yml: nothing this job produces
      # is shipped, signed or attested.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-yaml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm ci
      - run: npm test
      # The declared MSRV (`rust-version` in Cargo.toml) must keep building.
      - name: MSRV
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          cargo +1.88 check --workspace --locked --all-targets

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.0 --min-severity medium --min-confidence high .github/workflows/
      # actionlint's documented installer is `curl | bash`; the release
      # tarball is fetched instead and verified against a checksum recorded
      # here from the release's checksum list.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint_${VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color

  ci-ok:
    name: CI ok
    if: ${{ !cancelled() }}
    needs: [test, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: All gating jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing="$(echo "$NEEDS_JSON" | jq -r 'to_entries[]
            | select(.value.result != "success") | "\(.key): \(.value.result)"')"
          if [ -n "$failing" ]; then
            echo "::error::gating jobs did not succeed:"
            echo "$failing"
            exit 1
          fi
          echo "all gating jobs succeeded"
