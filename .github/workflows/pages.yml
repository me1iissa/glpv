# GitHub Pages: live examples of what a scan produces. Rebuilt on every push
# to master that can change the output, on demand, and weekly (the gitlab-org
# map tracks upstream's master).
#
#   /            landing page (docs/pages/index.html)
#   /demo/       the five-project demo (demo/projects)
#   /gitlab-org/ gitlab-org/gitlab and its downstream projects, scanned with a
#                real diff against master~1
#
# Deploy permissions live on the deploy job, not here: the build job renders
# repository content and has no business holding pages: write or an OIDC
# token while it does.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "ui/**"
      - "demo/**"
      - "docs/pages/**"
      - "docs/img/**"
      - "scripts/fetch-gitlab-corpus.sh"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build glpv
        run: cargo build --release --locked -p glpv-cli
      - name: Demo
        run: |
          cargo run -q --release -p glpv-cli --example build_fixtures -- demo/projects target/pages-demo
          ./target/release/glpv scan --projects target/pages-demo --entry pipelines-demo/shop \
            -o site/demo --format html,json,mermaid
      - name: gitlab-org corpus
        run: |
          scripts/fetch-gitlab-corpus.sh corpus
          ./target/release/glpv scan --projects corpus --entry gitlab-org/gitlab \
            --diff origin/master~1 -o site/gitlab-org --format html,json
      - name: Landing page
        run: |
          cp docs/pages/index.html site/index.html
          cp docs/img/demo-map.png docs/img/gitlab-org-map.png site/
          echo "built $(date -u +%Y-%m-%dT%H:%MZ) from $GITHUB_SHA" > site/build.txt
          du -sh site/*
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publishes the rendered artifact to the Pages origin
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
