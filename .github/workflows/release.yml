# Release automation for the public mirror: on a version tag (or on demand for
# an existing tag) verify, test, build the same archives the primary CI
# publishes, and create the GitHub Release with the changelog section as its
# body. Nothing here commits back: CHANGELOG.md is generated locally before a
# tag is cut (see cliff.toml).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to release (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REF: ${{ github.event.inputs.tag || github.ref }}
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - name: the tag must match the workspace version
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "workspace version $VER, tag $TAG"
          test "v$VER" = "$TAG"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: system packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-yaml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            packages: gcc-mingw-w64-x86-64 zip
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: system packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ${{ matrix.packages }}
      - run: cargo build --release --locked -p glpv-cli --target ${{ matrix.target }}
      - name: package
        run: |
          PKG=glpv-$TAG-${{ matrix.target }}
          mkdir -p dist/$PKG
          if [ "${{ matrix.archive }}" = zip ]; then
            cp target/${{ matrix.target }}/release/glpv.exe README.md LICENSE dist/$PKG/
            (cd dist && zip -qr $PKG.zip $PKG)
          else
            cp target/${{ matrix.target }}/release/glpv README.md LICENSE dist/$PKG/
            strip dist/$PKG/glpv
            tar -C dist -czf dist/$PKG.tar.gz $PKG
          fi
          rm -r dist/$PKG
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip | tee SHA256SUMS
      - name: release notes from the changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: notes.md
      - name: create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "glpv $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "glpv $TAG" --notes-file notes.md dist/*
          fi
