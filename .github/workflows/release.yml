# GitHub Releases for glpv: binaries, checksums, the dogfood map and a
# Sigstore build-provenance attestation, gated on the same checks as the
# GitLab side and on strict semantic versioning (docs/VERSIONING.md).
#
# Runs on every automatic credential and nothing else: the workflow token,
# scoped per job below, and the runner's OIDC identity for the attestation.
# There is no secret to configure and no cache on the path that ships bytes.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)publish, e.g. v0.3.0"
        required: true
        type: string

permissions: {}

# A tag build is never cancelled by a later one; it queues.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.tag || github.ref }}
  # git-cliff is fetched as a release tarball and verified against a checksum
  # recorded here from the release's own checksum list.
  GIT_CLIFF_VERSION: "2.13.1"
  GIT_CLIFF_SHA256: "200d2535da6d9703f3bcc8a4d159c3b55eacdb01cf2148c55b3eee9dd04d5249"

jobs:
  check:
    name: Tag, version and changelog agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is the workspace version
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "workspace version $ver, tag $TAG"
          test "v$ver" = "$TAG"
      - name: Changelog config (from the default branch when the tag predates it)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test -f cliff.toml || git show "origin/$DEFAULT_BRANCH:cliff.toml" > cliff.toml
      - name: The tag is the version the commits imply (strict SemVer)
        run: |
          f="git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "https://github.com/orhun/git-cliff/releases/download/v$GIT_CLIFF_VERSION/$f"
          echo "$GIT_CLIFF_SHA256  $f" | sha256sum -c -
          tar -xzf "$f"
          bumped="$("./git-cliff-$GIT_CLIFF_VERSION/git-cliff" --bumped-version)"
          echo "version implied by the commits: $bumped"
          test "$bumped" = "$TAG"

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      # A tag may predate the viewer tests (no package.json at v0.1.0): only
      # run npm when the lockfile is there. setup-node caches the package
      # manager's store by default since v7 — off here: nothing in a release
      # workflow may come from a cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-yaml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - run: npm test
        if: hashFiles('package-lock.json') != ''
      # The declared MSRV (`rust-version` in Cargo.toml) must keep building.
      - name: MSRV
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          cargo +1.88 check --workspace --locked --all-targets

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            packages: gcc-mingw-w64-x86-64 zip
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
      - name: System packages
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # a space-separated package list
          sudo apt-get install -y -qq --no-install-recommends $PACKAGES
      # Deliberately not cached. A restored `target/` is compiled object code
      # that the packaging below would ship — and then checksum and attest
      # without complaint. `--locked` pins sources; it says nothing about a
      # cache entry. A release is the one build that must start from nothing.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p glpv-cli --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          pkg="glpv-$TAG-$TARGET"
          mkdir -p "dist/$pkg"
          if [ "$ARCHIVE" = zip ]; then
            cp "target/$TARGET/release/glpv.exe" README.md LICENSE "dist/$pkg/"
            (cd dist && zip -qr "$pkg.zip" "$pkg")
          else
            cp "target/$TARGET/release/glpv" README.md LICENSE "dist/$pkg/"
            strip "dist/$pkg/glpv"
            tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          fi
          rm -r "dist/$pkg"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glpv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload publishes the release and its assets
      id-token: write # OIDC identity attest-build-provenance presents to Sigstore
      attestations: write # stores the signed attestation against the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Dogfood map (the release binary over this repository's own CI)
        run: |
          pkg="glpv-$TAG-x86_64-unknown-linux-musl"
          tar -xzf "dist/$pkg.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$pkg/glpv" scan --file .gitlab-ci.yml -o dogfood --format html
          cp dogfood/index.html "dist/glpv-$TAG-dogfood.html"
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz *.zip *.html | tee SHA256SUMS
      # SHA256SUMS proves a download matches what the workflow uploaded; it
      # proves nothing about where the build came from. The attestation is
      # signed with the runner's OIDC identity via Sigstore and recorded in a
      # public transparency log, tying every asset to this repository, this
      # workflow file, this commit and this trigger. Verify with:
      #   gh attestation verify <asset> -R me1iissa/glpv
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.html
      - name: Changelog config (from the default branch when the tag predates it)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test -f cliff.toml || git show "origin/$DEFAULT_BRANCH:cliff.toml" > cliff.toml
      - name: Release notes from the changelog
        run: |
          f="git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "https://github.com/orhun/git-cliff/releases/download/v$GIT_CLIFF_VERSION/$f"
          echo "$GIT_CLIFF_SHA256  $f" | sha256sum -c -
          tar -xzf "$f"
          "./git-cliff-$GIT_CLIFF_VERSION/git-cliff" --current --strip all -o notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "glpv $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "glpv $TAG" --notes-file notes.md dist/*
          fi
