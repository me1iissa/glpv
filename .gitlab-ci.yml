# CI for glpv itself. The dogfood job runs glpv over this very file.

stages:
  - check
  - test
  - release

.rust:
  image: rust:1.94-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry
      - target

fmt:
  extends: .rust
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  extends: .rust
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

test:
  extends: .rust
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-yaml
    - cargo test --workspace

dogfood:
  extends: .rust
  stage: test
  script:
    - cargo run -p glpv-cli -- scan --file .gitlab-ci.yml -o glpv-out
  artifacts:
    paths:
      - glpv-out/
    expire_in: 1 week

# ---------- viewer tests (node) ----------
# `samples` scans the fixture and demo repositories to HTML + JSON; `ui-test`
# runs the JS/wasm evaluator parity test and the jsdom smoke harness over them.

samples:
  extends: .rust
  stage: test
  script:
    - cargo run -q -p glpv-cli --example build_fixtures -- tests/fixtures/projects target/ui-test/fixtures
    - cargo run -q -p glpv-cli --example build_fixtures -- demo/projects target/ui-test/demo
    - cargo run -q -p glpv-cli -- scan --projects target/ui-test/fixtures --all --changed-file src/main.rs --changed-file docs/sub/x.md -o target/ui-test/out-fixtures --format html,json
    - cargo run -q -p glpv-cli -- scan --projects target/ui-test/demo --entry pipelines-demo/shop -o target/ui-test/out-demo --format html,json
    # a fresh wasm build of the evaluator: ui-test runs the parity suite
    # against it too, so a stale committed ui/eval-wasm.b64 cannot hide drift
    # between the Rust engine and its JS mirror
    - rustup target add wasm32-unknown-unknown
    - cargo build -q -p glpv-wasm --target wasm32-unknown-unknown --profile wasm-release
    - base64 -w0 target/wasm32-unknown-unknown/wasm-release/glpv_wasm.wasm > target/ui-test/eval-wasm.fresh.b64
    - 'echo "committed wasm: $(wc -c < ui/eval-wasm.b64) bytes; fresh build: $(wc -c < target/ui-test/eval-wasm.fresh.b64) bytes"'
  artifacts:
    paths:
      - target/ui-test/out-fixtures/
      - target/ui-test/out-demo/
      - target/ui-test/eval-wasm.fresh.b64
    expire_in: 1 week

ui-test:
  stage: test
  image: node:22-bookworm
  needs: ["samples"]
  variables:
    GLPV_SKIP_PREPARE: "1"
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci
    - npm test
    # the same parity suite against the evaluator built from source in `samples`
    - GLPV_WASM_B64=target/ui-test/eval-wasm.fresh.b64 node --test ui/test/parity.test.mjs

# ---------- corpus regression (scheduled / manual) ----------
# Scans gitlab-org/gitlab and its downstream projects from fresh blobless
# clones and asserts the shape the resolver is known to produce: any change in
# the pipeline/job counts or in the honest unresolved nodes is a regression (or
# upstream moved — check before adjusting the numbers).

corpus:
  extends: .rust
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  cache:
    key: gitlab-corpus
    paths:
      - corpus/
  script:
    - scripts/fetch-gitlab-corpus.sh corpus
    - cargo run -q --release -p glpv-cli -- scan --projects corpus --entry gitlab-org/gitlab --diff origin/master~1 -o corpus-out --format json | tee corpus-report.txt
    - |
      python3 - <<'PY'
      import json
      g = json.load(open("corpus-out/graph.json"))
      jobs = sum(len(p["jobs"]) for p in g["pipelines"])
      unresolved = sum(1 for p in g["pipelines"] if p.get("unresolved"))
      print(f"pipelines={len(g['pipelines'])} jobs={jobs} unresolved={unresolved} trigger_edges={len(g['trigger_edges'])}")
      assert 50 <= len(g["pipelines"]) <= 70, "pipeline count drifted"
      assert 2800 <= jobs <= 3600, "job count drifted"
      assert unresolved <= 12, "more unresolved nodes than the known honest set"
      root = next(p for p in g["pipelines"] if p["kind"] == "root")
      assert root.get("diff", {}).get("files"), "the diff was not applied to the root"
      PY
  artifacts:
    paths: [corpus-report.txt]
    expire_in: 1 month

# ---------- release builds (tags vX.Y.Z) ----------
# Binaries build only on version tags, after check + test pass, and are
# uploaded to the project's generic package registry (permanent URLs); the
# publish job then creates the GitLab Release with links to them.

.release:
  extends: .rust
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  variables:
    PKG_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/glpv/$CI_COMMIT_TAG

release:linux-x86_64:
  extends: .release
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends musl-tools
    - rustup target add x86_64-unknown-linux-musl
    - cargo build --release --locked -p glpv-cli --target x86_64-unknown-linux-musl
    - PKG=glpv-$CI_COMMIT_TAG-x86_64-unknown-linux-musl
    - mkdir -p dist/$PKG
    - cp target/x86_64-unknown-linux-musl/release/glpv README.md LICENSE dist/$PKG/
    - strip dist/$PKG/glpv
    - tar -C dist -czf dist/$PKG.tar.gz $PKG
    - sha256sum dist/$PKG.tar.gz | tee -a dist/SHA256SUMS
    - 'curl --fail --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/$PKG.tar.gz "$PKG_URL/$PKG.tar.gz"'
  artifacts:
    paths: [dist/SHA256SUMS]
    expire_in: 1 week

release:windows-x86_64:
  extends: .release
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 zip
    - rustup target add x86_64-pc-windows-gnu
    - cargo build --release --locked -p glpv-cli --target x86_64-pc-windows-gnu
    - PKG=glpv-$CI_COMMIT_TAG-x86_64-pc-windows-gnu
    - mkdir -p dist/$PKG
    - cp target/x86_64-pc-windows-gnu/release/glpv.exe README.md LICENSE dist/$PKG/
    - (cd dist && zip -qr $PKG.zip $PKG)
    - sha256sum dist/$PKG.zip | tee -a dist/SHA256SUMS
    - 'curl --fail --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/$PKG.zip "$PKG_URL/$PKG.zip"'
  artifacts:
    paths: [dist/SHA256SUMS]
    expire_in: 1 week

release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["release:linux-x86_64", "release:windows-x86_64"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  variables:
    GIT_DEPTH: 0 # git-cliff needs the tags and the full history
    GIT_CLIFF_VERSION: "2.13.1"
  script:
    # the tag must match the workspace version …
    - VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
    - echo "workspace version $VER, tag $CI_COMMIT_TAG"
    - test "v$VER" = "$CI_COMMIT_TAG"
    # … and the version the commit history implies (strict semantic versioning,
    # see docs/VERSIONING.md)
    - wget -qO- "https://github.com/orhun/git-cliff/releases/download/v$GIT_CLIFF_VERSION/git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-musl.tar.gz" | tar -xz
    - BUMPED=$(./git-cliff-$GIT_CLIFF_VERSION/git-cliff --bumped-version)
    - 'echo "version implied by the commits: $BUMPED"'
    - test "$BUMPED" = "$CI_COMMIT_TAG"
    - cat dist/SHA256SUMS
  release:
    tag_name: $CI_COMMIT_TAG
    description: >
      glpv $CI_COMMIT_TAG — static Linux (x86_64, musl) and Windows (x86_64)
      binaries. Checksums are in the SHA256SUMS job artifact of the build jobs.
    assets:
      links:
        - name: glpv-$CI_COMMIT_TAG-x86_64-unknown-linux-musl.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/glpv/$CI_COMMIT_TAG/glpv-$CI_COMMIT_TAG-x86_64-unknown-linux-musl.tar.gz
        - name: glpv-$CI_COMMIT_TAG-x86_64-pc-windows-gnu.zip
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/glpv/$CI_COMMIT_TAG/glpv-$CI_COMMIT_TAG-x86_64-pc-windows-gnu.zip
