# git-cliff configuration (https://git-cliff.org). CHANGELOG.md is generated
# locally before a release is tagged (`git cliff --tag vX.Y.Z -o CHANGELOG.md`);
# the GitHub release workflow renders the same section as the release body.

[changelog]
header = """# Changelog

All notable changes to glpv. Generated by [git-cliff](https://git-cliff.org)
from the commit history; each tagged section is also the body of that
version's GitHub Release.
"""
# Only the subject line of a commit is used, so trailers never appear.
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
# The history also has plain "area: subject" commits; keep them, grouped by
# the parsers below.
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^ui", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(ci|build)", group = "<!-- 6 -->CI and build" },
  { message = "^release", skip = true },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]"
sort_commits = "oldest"

# Strict semantic versioning (https://semver.org): `git cliff --bumped-version`
# derives the next tag from the commits since the last one — a breaking
# change (`feat!:` / `BREAKING CHANGE:`) bumps MAJOR, a feature bumps MINOR,
# anything else PATCH. While the major version is 0, breaking changes bump
# MINOR (SemVer §4). The release jobs refuse a tag that disagrees.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
