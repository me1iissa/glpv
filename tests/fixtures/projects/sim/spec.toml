# A project whose rules only decide under specific simulations: exercised by
# the viewer smoke tests (enable-in-simulation, outcome explorer) and by the
# JS/wasm parity matrix.
dir = "sim-project"
remote = "git@fixtures.local:fx/sim.git"
default_branch = "main"

[[commits]]
message = "ci with simulation-sensitive rules"

[commits.files]
"terraform/main.tf" = "# empty\n"
".gitlab-ci.yml" = '''
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH

stages: [build, deploy]

build:
  stage: build
  script: [make]

docs:
  stage: build
  script: [make docs]
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^docs\//U
    - if: $DOCS_MODE =~ /(?=x)/
      when: never
    - when: manual

deploy-prod:
  stage: deploy
  needs: [build]
  script: [make deploy]
  rules:
    - if: $DEPLOY_ENV == "production" && $CI_COMMIT_BRANCH == "main"
    - if: $DEPLOY_ENV == "staging"
      when: manual

infra-apply:
  stage: deploy
  script: [terraform apply]
  rules:
    - changes: [infra/**/*]
    - exists: [terraform/*.tf]
      when: manual

nightly-report:
  stage: deploy
  script: [make report]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $REPORT_KIND =~ /^(daily|weekly)$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
'''
